name: Celiador PR (celiador-ai)

# Checks for the built-in celiador-ai extension: compile (tsc, which is the
# type check) and the node:test unit tests. The extension has its own lockfile,
# so this needs no root install and takes about a minute on a hosted runner.

on:
  pull_request:
    paths:
      - 'extensions/celiador-ai/**'
      - 'extensions/tsconfig.base.json'
      - 'src/vscode-dts/vscode.d.ts'
      - 'src/vscode-dts/vscode.proposed.authIssuers.d.ts'
      - '.github/workflows/celiador-pr-extension.yml'
  push:
    branches: [main]
    paths:
      - 'extensions/celiador-ai/**'
      - '.github/workflows/celiador-pr-extension.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  celiador-ai:
    name: celiador-ai compile and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install extension dependencies
        run: npm ci --prefix extensions/celiador-ai

      - name: Compile and run unit tests
        run: npm --prefix extensions/celiador-ai run test:unit
