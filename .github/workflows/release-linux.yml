# Build and publish the Linux packages — the Linux counterpart of release-macos.yml.
# Manual only; one run = one published build.
#
# Two jobs, because the two things a release needs live on different machines:
# the build runs on a hosted Ubuntu runner (the glibc 2.28 sysroot setup is
# Linux-only), and publishing runs on the self-hosted Mac, which is the machine
# that holds ssh access to the box. The packages cross over as a short-lived
# workflow artifact (1 day — the account's artifact storage is small).
#
# No signing on Linux in v1: .deb/.rpm GPG signing is a follow-up. See
# docs/RELEASING.md.

name: Release (Linux)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (markdown) shown on celiador.ai/releases
        required: false
        default: ""
      publish:
        description: Publish to celiador.ai (off = build only, upload as a workflow artifact)
        type: boolean
        default: true

concurrency:
  # Shared with release-macos.yml: both read, merge and rewrite the one published
  # manifest, so two releases at once would drop each other's entry.
  group: celiador-release-manifest
  cancel-in-progress: false

permissions:
  contents: read

env:
  VSCODE_ARCH: x64
  NPM_ARCH: x64

jobs:
  build:
    name: Build (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # Full history: the build number is the commit count (build/gulpfile.vscode.ts);
          # the release script refuses a build stamped from a shallow checkout.
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install system dependencies
        run: |
          set -e
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            pkg-config libxkbfile-dev libkrb5-dev libsecret-1-dev libgbm1 \
            fakeroot dpkg-dev rpm xvfb

      - name: Restore pnpm store cache
        id: cache-pnpm-store
        uses: ./.github/actions/restore-pnpm-store
        with:
          key-prefix: celiador-pnpm-store-linux

      - name: Install build dependencies
        working-directory: build
        run: |
          set -e
          for i in {1..5}; do
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then echo "pnpm install failed too many times" >&2; exit 1; fi
            echo "pnpm install failed $i, trying again..."
          done

      - name: Install dependencies
        run: |
          set -e
          # Build native modules against the glibc 2.28 sysroot so the app runs on older distros
          # and the .deb/.rpm dependency lists match build/linux/*/dep-lists.ts.
          source ./build/azure-pipelines/linux/setup-env.sh
          for i in {1..5}; do
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then echo "pnpm install failed too many times" >&2; exit 1; fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Save pnpm store cache
        if: steps.cache-pnpm-store.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-pnpm-store

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts

      - name: Let the built app start
        # The build launches the packaged app once to generate its Node.js compile
        # cache (build/lib/nodeCompileCache.ts, from the upstream sync). Ubuntu 24.04
        # blocks unprivileged user namespaces, so Chromium falls back to the setuid
        # sandbox helper, which is not root-owned in a fresh build and aborts the
        # launch. Re-allow the namespace sandbox on this throwaway runner, and give
        # the app a display (upstream runs this step under Xvfb on :10 too).
        run: |
          set -e
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          Xvfb :10 -screen 0 1024x768x24 >/dev/null 2>&1 &
          echo "DISPLAY=:10" >> "$GITHUB_ENV"

      - name: Build app
        run: pnpm run gulp vscode-linux-${{ env.VSCODE_ARCH }}-min

      - name: Verify the AI extension actually compiled
        run: |
          EXT="../VSCode-linux-${VSCODE_ARCH}/resources/app/extensions/celiador-ai/out/extension.js"
          test -f "$EXT" || { echo "::error::celiador-ai has no compiled entry point at $EXT"; exit 1; }

      - name: Assert no proprietary Copilot code shipped
        run: |
          APPDIR="../VSCode-linux-${VSCODE_ARCH}/resources/app/node_modules"
          for pkg in @github/copilot @github/copilot-sdk @vscode/copilot-api; do
            if [ -d "$APPDIR/$pkg" ]; then
              echo "::error::$pkg was packaged into the app"; exit 1
            fi
          done
          echo "No proprietary Copilot packages in the bundle."

      - name: Build .deb and .rpm
        run: |
          set -e
          pnpm run gulp vscode-linux-${{ env.VSCODE_ARCH }}-prepare-deb
          pnpm run gulp vscode-linux-${{ env.VSCODE_ARCH }}-build-deb
          pnpm run gulp vscode-linux-${{ env.VSCODE_ARCH }}-prepare-rpm
          pnpm run gulp vscode-linux-${{ env.VSCODE_ARCH }}-build-rpm

      - name: Collect packages
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          NAME="Celiador-linux-${VSCODE_ARCH}-${VERSION}"
          mkdir -p .build/out
          tar -czf ".build/out/${NAME}.tar.gz" -C .. VSCode-linux-${VSCODE_ARCH}
          cp .build/linux/deb/*/deb/*.deb ".build/out/${NAME}.deb"
          cp .build/linux/rpm/*/*.rpm ".build/out/${NAME}.rpm"
          ls -la .build/out

      - name: Hand the packages to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: celiador-linux-x64-packages
          path: .build/out/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    if: inputs.publish
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: build/celiador
          # Its own directory: a sparse checkout is a blob:none partial clone, and in
          # the shared workspace it turned the macOS release's full clone into one,
          # which git-lfs can't fetch from.
          path: linux-publish

      - name: Fetch the packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: celiador-linux-x64-packages
          path: ${{ runner.temp }}/linux-packages

      - name: Release
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          ARGS=(--packages "$RUNNER_TEMP/linux-packages" --out "$RUNNER_TEMP/celiador-release-linux" --publish)
          [ -n "$NOTES" ] && ARGS+=(--notes "$NOTES")
          linux-publish/build/celiador/release-linux.sh "${ARGS[@]}"

      - name: Keep the manifest entry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: celiador-linux-release-manifest
          path: ${{ runner.temp }}/celiador-release-linux/*.json
          retention-days: 14
