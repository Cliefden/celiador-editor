# Build, sign, notarize and publish the macOS app — the release counterpart of
# celiador-build.yml's macOS job. One run = one published build. Three triggers
# (CHANNELS.md):
#   - manual (workflow_dispatch): any channel; the only way to release prod;
#   - a train tag in Cliefden/celiador (repository_dispatch "celiador-release",
#     sent by that repo's editor-test-build.yml on a vX.Y.Z tag): a test build
#     from main, its icon stamped with the train tag;
#   - nightly (schedule): a dev build from main, skipped when the dev feed
#     already has this commit.
#
# Runs on the self-hosted Mac runner (scw-mac), where everything the release
# needs already lives: the Developer ID Application identity in the login
# keychain, `asc` signed in to App Store Connect (notarization), and ssh access
# to the box. Repository secrets: CELIADOR_SIGNING_KEYCHAIN_PASSWORD,
# CELIADOR_ASC_KEY_ID, CELIADOR_ASC_ISSUER_ID — see docs/RELEASING.md for those
# and the one-time machine setup. The hosted-runner + S3 variant this replaced never ran.

name: Release (macOS)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (markdown) shown on celiador.ai/releases
        required: false
        default: ""
      publish:
        description: Publish to the channel's environment (off = build + notarize, upload as a workflow artifact only)
        type: boolean
        default: true
      channel:
        description: Build channel (CHANNELS.md) — which app identity, daemon and update feed
        type: choice
        options: [prod, test, dev]
        default: prod
  repository_dispatch:
    # client_payload: { "tag": "vX.Y.Z" } — the Cliefden/celiador train tag.
    types: [celiador-release]
  schedule:
    # Nightly dev build (03:17 UTC; off the hour, when scheduled runs pile up).
    # The self-hosted Mac has to be awake; a missed night is just skipped.
    - cron: "17 3 * * *"

concurrency:
  # Shared with release-linux.yml: both read, merge and rewrite the one published
  # manifest, so two releases at once would drop each other's entry.
  group: celiador-release-manifest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    # Turns the trigger into channel / publish / notes / label, so the release
    # job reads needs.plan.outputs.* instead of inputs.* (empty for
    # repository_dispatch and schedule). Runs on a hosted runner: a nightly with
    # nothing new is skipped here without waking the Mac.
    name: Plan
    runs-on: ubuntu-24.04
    # Automatic triggers only in the real repo (never in a fork).
    if: github.event_name == 'workflow_dispatch' || github.repository == 'Cliefden/celiador-editor'
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      notes: ${{ steps.plan.outputs.notes }}
      label: ${{ steps.plan.outputs.label }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Resolve channel, notes and label
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_NOTES: ${{ inputs.notes }}
          # From another repo's payload: validated, and only ever handled via env.
          TAG: ${{ github.event.client_payload.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:11}" label="" build=true
          case "$EVENT" in
            workflow_dispatch)
              channel="${IN_CHANNEL:-prod}" publish="$IN_PUBLISH" notes="$IN_NOTES" ;;
            repository_dispatch)
              if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::client_payload.tag must be vX.Y.Z"
                exit 1
              fi
              channel=test publish=true label="$TAG"
              notes="Test build for the Celiador $TAG train (editor $short)." ;;
            schedule)
              channel=dev publish=true
              notes="Nightly dev build from main ($short)."
              # Nothing to do when the dev feed already has this commit (a
              # manifest entry's version is the build's commit). A failed
              # lookup builds anyway.
              if releases="$(curl -fsS --max-time 20 --retry 3 https://dev.celiador.ai/api/releases)"; then
                have="$(RELEASES="$releases" node -e '
                  const { releases = [] } = JSON.parse(process.env.RELEASES);
                  console.log(releases.some(r => r.platform === "darwin-arm64" && r.quality === "insider" && r.version === process.argv[1]));
                ' "$SHA")"
                if [ "$have" = true ]; then
                  build=false
                  echo "::notice::The dev feed already has $short; nothing to build."
                fi
              else
                echo "::warning::Couldn't read the dev release feed; building anyway."
              fi ;;
            *)
              echo "::error::unexpected trigger $EVENT"
              exit 1 ;;
          esac
          echo "$EVENT → channel $channel, publish $publish, label ${label:-<default>}, build $build"
          {
            echo "channel=$channel"
            echo "publish=$publish"
            echo "label=$label"
            echo "build=$build"
            echo "notes<<CELIADOR_NOTES_EOF"
            echo "$notes"
            echo "CELIADOR_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    name: macOS (arm64)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 240
    env:
      NPM_ARCH: arm64
      VSCODE_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # Full history: the build number is the commit count (build/gulpfile.vscode.ts);
          # a depth-1 checkout would stamp "build 1". The self-hosted runner keeps its
          # checkout, so after the first full fetch this is incremental.
          fetch-depth: 0

      - name: Check release credentials
        # Fail in seconds, not after the hour-long build, when a secret or the
        # App Store Connect key file is missing (docs/RELEASING.md, step 2).
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.CELIADOR_SIGNING_KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.CELIADOR_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CELIADOR_ASC_ISSUER_ID }}
        run: |
          missing=0
          require() { # <value> <secret name>
            if [ -z "$1" ]; then
              echo "::error::Repository secret $2 is not set (docs/RELEASING.md)."
              missing=1
            fi
          }
          require "$KEYCHAIN_PASSWORD" CELIADOR_SIGNING_KEYCHAIN_PASSWORD
          require "$ASC_KEY_ID" CELIADOR_ASC_KEY_ID
          require "$ASC_ISSUER_ID" CELIADOR_ASC_ISSUER_ID
          [ "$missing" = 0 ] || exit 1
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          if [ ! -f "$KEY_FILE" ]; then
            echo "::error::No App Store Connect key file for the key ID in CELIADOR_ASC_KEY_ID at ~/.appstoreconnect/private_keys/ on this runner (docs/RELEASING.md)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore pnpm store cache
        id: cache-pnpm-store
        uses: ./.github/actions/restore-pnpm-store
        with:
          key-prefix: celiador-pnpm-store-macos

      - name: Install dependencies
        run: |
          set -e
          # node-gyp needs setuptools on Python 3.12+; Xcode's older pip has no --break-system-packages.
          python3 -m pip install --break-system-packages setuptools 2>/dev/null || python3 -m pip install --user setuptools || echo "setuptools not installed; continuing"
          for i in {1..5}; do
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then echo "pnpm install failed too many times" >&2; exit 1; fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GYP_DEFINES: "kerberos_use_rtld=false"

      - name: Save pnpm store cache
        if: steps.cache-pnpm-store.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-pnpm-store

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts

      - name: Select channel
        # Overlays product.json for test/dev (app identity, daemon, update feed)
        # and stamps the icon (red + commit for dev, green + tag for test); prod
        # restores the committed files. The gulp output is then named after
        # nameLong ("Celiador Test.app"), so later steps find the bundle by glob.
        # A train-triggered test build is labelled with the train tag.
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          LABEL: ${{ needs.plan.outputs.label }}
        run: build/celiador/channel.sh "$CHANNEL" ${LABEL:+"$LABEL"}

      - name: Build app
        run: pnpm run gulp vscode-darwin-${{ env.VSCODE_ARCH }}-min

      - name: Verify the AI extension actually compiled
        # The build packages whatever out/ exists; without this file the app ships
        # with no language model at all, invisible until someone opens chat.
        run: |
          EXT="$(ls -d ../VSCode-darwin-${VSCODE_ARCH}/*.app)/Contents/Resources/app/extensions/celiador-ai/out/extension.js"
          test -f "$EXT" || { echo "::error::celiador-ai has no compiled entry point at $EXT"; exit 1; }

      - name: Assert no proprietary Copilot code shipped
        # @github/copilot* and @vscode/copilot-api are GitHub-proprietary and must
        # stay devDependencies. This is the check that they did.
        run: |
          APPDIR="$(ls -d ../VSCode-darwin-${VSCODE_ARCH}/*.app)/Contents/Resources/app/node_modules"
          for pkg in @github/copilot @github/copilot-sdk @vscode/copilot-api; do
            if [ -d "$APPDIR/$pkg" ]; then
              echo "::error::$pkg was packaged into the app"; exit 1
            fi
          done
          echo "No proprietary Copilot packages in the bundle."

      - name: Sign, notarize, package, publish
        env:
          NOTES: ${{ needs.plan.outputs.notes }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          # The runner's launchd session (SessionCreate) can't see the login
          # keychain, so the Developer ID identity lives in a dedicated keychain
          # on this Mac (docs/RELEASING.md); its password is the one secret.
          # (The path is built in the shell: the runner's HOME is not in the
          # workflow `env` context, so an expression here would drop it.)
          KEYCHAIN_PASSWORD: ${{ secrets.CELIADOR_SIGNING_KEYCHAIN_PASSWORD }}
          # asc keeps its App Store Connect key in the keychain, which this
          # session can't read either; hand it the key file on this Mac instead
          # (complete env credentials take precedence over stored profiles).
          # Key ID and issuer come from repository secrets so the key can be
          # rotated without a code change (editor#82).
          ASC_KEY_ID: ${{ secrets.CELIADOR_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CELIADOR_ASC_ISSUER_ID }}
        run: |
          set -e
          export ASC_PRIVATE_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          KEYCHAIN="$HOME/Library/Keychains/celiador-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Make it visible to this session's search list (the login keychain
          # stays listed for the intermediate certificates).
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          export CELIADOR_SIGNING_KEYCHAIN="$KEYCHAIN"
          ARGS=(--out "$RUNNER_TEMP/celiador-release")
          [ -n "$NOTES" ] && ARGS+=(--notes "$NOTES")
          [ "$PUBLISH" = "true" ] && ARGS+=(--publish)
          build/celiador/release-macos.sh "${ARGS[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: celiador-macos-release
          path: |
            ${{ runner.temp }}/celiador-release/*.dmg
            ${{ runner.temp }}/celiador-release/*.zip
            ${{ runner.temp }}/celiador-release/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Restore product.json and the icon
        # The self-hosted runner keeps its checkout; never leave an overlaid
        # product.json or a stamped icon behind for the next run or a local build.
        if: always()
        run: git checkout -- product.json resources/darwin/code.icns
