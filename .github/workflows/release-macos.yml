# Build, sign, notarize and publish the macOS app — the release counterpart of
# celiador-build.yml's macOS job. Manual only; one run = one published build.
#
# Runs on the self-hosted Mac runner (scw-mac), where everything the release
# needs already lives: the Developer ID Application identity in the login
# keychain, `asc` signed in to App Store Connect (notarization), and ssh access
# to the box. No repository secrets — see docs/RELEASING.md for the one-time
# machine setup. The hosted-runner + S3 variant this replaced never ran.

name: Release (macOS)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (markdown) shown on celiador.ai/releases
        required: false
        default: ""
      publish:
        description: Publish to the channel's environment (off = build + notarize, upload as a workflow artifact only)
        type: boolean
        default: true
      channel:
        description: Build channel (CHANNELS.md) — which app identity, daemon and update feed
        type: choice
        options: [prod, test, dev]
        default: prod

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: macOS (arm64)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 240
    env:
      NPM_ARCH: arm64
      VSCODE_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # Full history: the build number is the commit count (build/gulpfile.vscode.ts);
          # a depth-1 checkout would stamp "build 1". The self-hosted runner keeps its
          # checkout, so after the first full fetch this is incremental.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: celiador-node_modules-macos
          key-args: "darwin ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          # node-gyp needs setuptools on Python 3.12+; Xcode's older pip has no --break-system-packages.
          python3 -m pip install --break-system-packages setuptools 2>/dev/null || python3 -m pip install --user setuptools || echo "setuptools not installed; continuing"
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed too many times" >&2; exit 1; fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GYP_DEFINES: "kerberos_use_rtld=false"

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-node-modules

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts

      - name: Select channel
        # Overlays product.json for test/dev (app identity, daemon, update feed)
        # and stamps the icon (red + commit for dev, green + tag for test); prod
        # restores the committed files. The gulp output is then named after
        # nameLong ("Celiador Test.app"), so later steps find the bundle by glob.
        run: build/celiador/channel.sh "${{ inputs.channel || 'prod' }}"

      - name: Build app
        run: npm run gulp vscode-darwin-${{ env.VSCODE_ARCH }}-min

      - name: Verify the AI extension actually compiled
        # The build packages whatever out/ exists; without this file the app ships
        # with no language model at all, invisible until someone opens chat.
        run: |
          EXT="$(ls -d ../VSCode-darwin-${VSCODE_ARCH}/*.app)/Contents/Resources/app/extensions/celiador-ai/out/extension.js"
          test -f "$EXT" || { echo "::error::celiador-ai has no compiled entry point at $EXT"; exit 1; }

      - name: Assert no proprietary Copilot code shipped
        # @github/copilot* and @vscode/copilot-api are GitHub-proprietary and must
        # stay devDependencies. This is the check that they did.
        run: |
          APPDIR="$(ls -d ../VSCode-darwin-${VSCODE_ARCH}/*.app)/Contents/Resources/app/node_modules"
          for pkg in @github/copilot @github/copilot-sdk @vscode/copilot-api; do
            if [ -d "$APPDIR/$pkg" ]; then
              echo "::error::$pkg was packaged into the app"; exit 1
            fi
          done
          echo "No proprietary Copilot packages in the bundle."

      - name: Sign, notarize, package, publish
        env:
          NOTES: ${{ inputs.notes }}
          # The runner's launchd session (SessionCreate) can't see the login
          # keychain, so the Developer ID identity lives in a dedicated keychain
          # on this Mac (docs/RELEASING.md); its password is the one secret.
          # (The path is built in the shell: the runner's HOME is not in the
          # workflow `env` context, so an expression here would drop it.)
          KEYCHAIN_PASSWORD: ${{ secrets.CELIADOR_SIGNING_KEYCHAIN_PASSWORD }}
          # asc keeps its App Store Connect key in the keychain, which this
          # session can't read either; hand it the key file on this Mac instead
          # (complete env credentials take precedence over stored profiles).
          ASC_KEY_ID: R73AU5822H
          ASC_ISSUER_ID: 69a6de70-4abf-47e3-e053-5b8c7c11a4d1
        run: |
          set -e
          export ASC_PRIVATE_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          KEYCHAIN="$HOME/Library/Keychains/celiador-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Make it visible to this session's search list (the login keychain
          # stays listed for the intermediate certificates).
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          export CELIADOR_SIGNING_KEYCHAIN="$KEYCHAIN"
          ARGS=(--out "$RUNNER_TEMP/celiador-release")
          [ -n "$NOTES" ] && ARGS+=(--notes "$NOTES")
          [ "${{ inputs.publish }}" = "true" ] && ARGS+=(--publish)
          build/celiador/release-macos.sh "${ARGS[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: celiador-macos-release
          path: |
            ${{ runner.temp }}/celiador-release/*.dmg
            ${{ runner.temp }}/celiador-release/*.zip
            ${{ runner.temp }}/celiador-release/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Restore product.json and the icon
        # The self-hosted runner keeps its checkout; never leave an overlaid
        # product.json or a stamped icon behind for the next run or a local build.
        if: always()
        run: git checkout -- product.json resources/darwin/code.icns
