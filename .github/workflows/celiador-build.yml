name: Celiador Build

# Builds the Celiador desktop app for macOS, Windows and Linux.
# - Every push to main and every manual run uploads the packages as workflow artifacts.
# - Pull requests that touch the build, packaging or branding also build, so
#   packaging breaks are caught before merge.
# - Pushing a tag like v0.1.0 also attaches the packages to a draft GitHub release.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/celiador-build.yml'
      - 'build/**'
      - 'resources/**'
      - 'product.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    env:
      NPM_ARCH: ${{ matrix.arch }}
      VSCODE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          set -e
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            pkg-config libxkbfile-dev libkrb5-dev libsecret-1-dev libgbm1 \
            fakeroot dpkg-dev rpm

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: celiador-node_modules-linux
          key-args: "linux ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Install build dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: build
        run: |
          set -e
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed too many times" >&2; exit 1; fi
            echo "npm ci failed $i, trying again..."
          done

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          # Build native modules against the glibc 2.28 sysroot so the app runs on older distros
          # and the .deb/.rpm dependency lists match build/linux/*/dep-lists.ts.
          source ./build/azure-pipelines/linux/setup-env.sh
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed too many times" >&2; exit 1; fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.head_ref == 'cursor/restore-activate-and-fix-cache-5658')
        uses: ./.github/actions/save-node-modules

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts

      - name: Build app
        run: npm run gulp vscode-linux-${{ env.VSCODE_ARCH }}-min

      - name: Build .deb
        run: |
          set -e
          npm run gulp vscode-linux-${{ env.VSCODE_ARCH }}-prepare-deb
          npm run gulp vscode-linux-${{ env.VSCODE_ARCH }}-build-deb

      - name: Build .rpm
        run: |
          set -e
          npm run gulp vscode-linux-${{ env.VSCODE_ARCH }}-prepare-rpm
          npm run gulp vscode-linux-${{ env.VSCODE_ARCH }}-build-rpm

      - name: Collect packages
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          NAME="Celiador-linux-${VSCODE_ARCH}-${VERSION}"
          mkdir -p .build/out
          tar -czf ".build/out/${NAME}.tar.gz" -C .. VSCode-linux-${VSCODE_ARCH}
          cp .build/linux/deb/*/deb/*.deb ".build/out/${NAME}.deb"
          cp .build/linux/rpm/*/*.rpm ".build/out/${NAME}.rpm"
          ls -la .build/out

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: celiador-linux-${{ matrix.arch }}
          path: .build/out/*
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    env:
      NPM_ARCH: ${{ matrix.arch }}
      VSCODE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: celiador-node_modules-windows
          key-args: "win32 ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          # Patch Electron/v8 headers before native modules compile.
          exec { node build/npm/preinstall.ts }

          for ($i = 1; $i -le 5; $i++) {
            try {
              exec { npm ci }
              break
            }
            catch {
              if ($i -eq 5) { Write-Error "npm ci failed after 5 attempts"; throw }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          npm_config_foreground_scripts: "true"
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.head_ref == 'cursor/restore-activate-and-fix-cache-5658')
        uses: ./.github/actions/save-node-modules

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts

      - name: Build app
        run: npm run gulp vscode-win32-${{ env.VSCODE_ARCH }}-min

      - name: Build installers
        run: |
          npm run gulp vscode-win32-${{ env.VSCODE_ARCH }}-inno-updater
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run gulp vscode-win32-${{ env.VSCODE_ARCH }}-user-setup
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run gulp vscode-win32-${{ env.VSCODE_ARCH }}-system-setup
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Collect packages
        run: |
          $ErrorActionPreference = "Stop"
          $Version = node -p "require('./package.json').version"
          $Arch = "${{ env.VSCODE_ARCH }}"
          New-Item -ItemType Directory -Force .build\out | Out-Null
          Move-Item ".build\win32-$Arch\user-setup\VSCodeSetup.exe" ".build\out\CeliadorUserSetup-$Arch-$Version.exe"
          Move-Item ".build\win32-$Arch\system-setup\VSCodeSetup.exe" ".build\out\CeliadorSetup-$Arch-$Version.exe"
          Compress-Archive -Path "..\VSCode-win32-$Arch\*" -DestinationPath ".build\out\Celiador-win32-$Arch-$Version.zip"
          Get-ChildItem .build\out

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: celiador-windows-${{ matrix.arch }}
          path: .build/out/*
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    env:
      NPM_ARCH: ${{ matrix.arch }}
      VSCODE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: celiador-node_modules-macos
          key-args: "darwin ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          python3 -m pip install --break-system-packages setuptools
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed too many times" >&2; exit 1; fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          # Load Kerberos directly instead of via dlopen (see pr-darwin-test.yml).
          GYP_DEFINES: "kerberos_use_rtld=false"

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.head_ref == 'cursor/restore-activate-and-fix-cache-5658')
        uses: ./.github/actions/save-node-modules

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts

      - name: Build app
        run: npm run gulp vscode-darwin-${{ env.VSCODE_ARCH }}-min

      - name: Sign and package
        env:
          # Optional repository secrets. With them, the app is signed with a stable named
          # identity (see README "Sign it"); without them it is signed ad-hoc, which launches
          # but makes macOS re-prompt for the "Celiador Safe Storage" keychain item.
          #   MACOS_CERTIFICATE           base64 of a .p12 export of the signing certificate + key
          #   MACOS_CERTIFICATE_PASSWORD  password of that .p12
          #   MACOS_SIGNING_IDENTITY      e.g. "Apple Development: Name (TEAMID)"
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          NAME="Celiador-darwin-${VSCODE_ARCH}-${VERSION}"
          APP="../VSCode-darwin-${VSCODE_ARCH}/Celiador.app"
          # Apple Silicon refuses to launch unsigned code, and packaging invalidates Electron's
          # own signature, so the app is always re-signed.
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            KEYCHAIN="$RUNNER_TEMP/celiador-signing.keychain-db"
            KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            codesign --force --deep --sign "$MACOS_SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$APP"
          else
            echo "::warning::MACOS_CERTIFICATE / MACOS_SIGNING_IDENTITY not set; signing ad-hoc. Downloaded copies need 'xattr -dr com.apple.quarantine Celiador.app' before first launch."
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          mkdir -p .build/out
          ditto -c -k --sequesterRsrc --keepParent "$APP" ".build/out/${NAME}.zip"
          hdiutil create -volname Celiador -srcfolder "$APP" -ov -format UDZO ".build/out/${NAME}.dmg"
          ls -la .build/out

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: celiador-macos-${{ matrix.arch }}
          path: .build/out/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        run: |
          set -e
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Celiador $GITHUB_REF_NAME" \
            --generate-notes \
            --draft
